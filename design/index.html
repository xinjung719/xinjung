</head>

        </div>
        <div class="content">

    </div>
    <div class="pop-dark"></div>
    <script>
        $(document).ready(function () {
            $(".nav-change-btn").click(function () {
                $(".nav").toggleClass("nav-show");
                $(".nav-change-btn").toggleClass("nav-change-btn-active");
                $(".pop-dark").toggle();
            });
            $(".pop-dark").click(function () {
                $(".nav").removeClass("nav-show");
                $(".nav-change-btn").removeClass("nav-change-btn-active");
                $(".pop-dark").hide();
            });
        });
    </script>

    <script>
        function reportWindowSize() {
            if (window.innerWidth > 1200) {
                $(".nav").removeClass("nav-show");
                $(".nav-change-btn").removeClass("nav-change-btn-active");
                $(".pop-dark").hide();
            };
        }
        window.onresize = reportWindowSize;
    </script>

</body>

</html>
