<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Page Scrolling</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            scroll-behavior: smooth;
        }

        body {
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
        }

        .section {
            width: 100%;
            /* display: flex; */
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 3em;
            color: white;
            scroll-snap-align: start;
            height: 100vh;
            /* 確保每個 section 都占滿整個視窗高度 */
            overflow: auto;
        }

        #section1 {
            background-color: #1abc9c;
        }

        #section2 {
            background-color: #3498db;
        }

        #section3 {
            background-color: #e74c3c;
        }

        #nav-indicators {
            position: fixed;
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .indicator {
            width: 10px;
            height: 10px;
            background-color: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            margin: 5px 0;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .indicator.active {
            background-color: white;
        }
    </style>
</head>

<body>
    <div id="nav-indicators"></div>
    <div class="section" id="section1">
        <h1>Section 1</h1>
    </div>
    <div class="section" id="section2">
        <h1>Section 2</h1>
        <h1>Section 2</h1>
        <h1>Section 2</h1>
        <h1>Section 2</h1>
        <h1>Section 2</h1>
        <h1>Section 2</h1>
        <h1>Section 2</h1>
        <h1>Section 2</h1>
        <h1>Section 2</h1>
        <h1>Section 2</h1>
        <h1>Section 2</h1>
        <h1>Section 2</h1>
        <h1>Section 2</h1>
        <h1>Section 2</h1>
        <h1>Section 2</h1>
        <h1>Section 2</h1>
        <h1>Section 2</h1>
        <h1>Section 2</h1>
        <h1>Section 2</h1>
        <h1>Section 2</h1>
        <h1>Section 2</h1>
    </div>
    <div class="section" id="section3">
        <h1>Section 3</h1>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const sections = document.querySelectorAll('.section');
            const navIndicators = document.getElementById('nav-indicators');
            const indicators = [];

            // 創建指示點並設置點擊事件
            sections.forEach((section, index) => {
                const indicator = document.createElement('div');
                indicator.classList.add('indicator');
                if (index === 0) {
                    indicator.classList.add('active');
                }
                indicator.addEventListener('click', () => {
                    // 移除所有指示點的 active 類
                    indicators.forEach(ind => ind.classList.remove('active'));
                    // 將點擊的指示點添加 active 類
                    indicator.classList.add('active');
                    // 滾動到相應的部分
                    section.scrollIntoView({ behavior: 'smooth' });
                });
                indicators.push(indicator);
                navIndicators.appendChild(indicator);
            });

            // 使用 IntersectionObserver 來監聽 section 進入和離開視窗
            const observerOptions = {
                root: null,
                rootMargin: '0px',
                threshold: 0.5 // 50% 可見度閾值
            };

            const observerCallback = (entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const index = Array.from(sections).indexOf(entry.target);
                        indicators.forEach((indicator, i) => {
                            if (i === index) {
                                indicator.classList.add('active');
                            } else {
                                indicator.classList.remove('active');
                            }
                        });
                    }
                });
            };

            const observer = new IntersectionObserver(observerCallback, observerOptions);

            sections.forEach(section => {
                observer.observe(section);
            });
        });
    </script>
</body>

</html>
