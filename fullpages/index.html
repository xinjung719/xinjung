<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Page Scrolling</title>
    <!-- <link rel="stylesheet" href="styles.css"> -->
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            scroll-behavior: smooth;
        }

        .section {
            width: 100%;
            /* height: 100vh; */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 3em;
            color: white;
            overflow: auto;
            transition: 1s;
        }

        #section1 {
            height: 100vh;
            background-color: #1abc9c;
        }

        #section2 {
            height: 100vh;
            background-color: #3498db;
        }

        #section3 {
            background-color: #e74c3c;
        }

        body {
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
        }

        .section {
            scroll-snap-align: start;
        }
    </style>
</head>

<body>
    <div class="section" id="section1">
        <h1>Section 1</h1>
        <h1>Section 1</h1>
        <h1>Section 1</h1>
        <h1>Section 1</h1>
        <h1>Section 1</h1>
    </div>
    <div class="section" id="section2">
        <h1>Section 2</h1>
        <h1>Section 2</h1>
        <h1>Section 2</h1>
        <h1>Section 2</h1>
        <h1>Section 2</h1>
        <h1>Section 2</h1>
        <h1>Section 2</h1>
        <h1>Section 2</h1>
        <h1>Section 2</h1>
        <h1>Section 2</h1>
        <h1>Section 2</h1>
        <h1>Section 2</h1>
        <h1>Section 2</h1>
    </div>
    <div class="section" id="section3">
        <h1>Section 3</h1>
    </div>
</body>

</html>
